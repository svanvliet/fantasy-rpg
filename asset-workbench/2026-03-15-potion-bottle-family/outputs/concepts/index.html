<!doctype html>
<html lang="en">
  <head>

    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;

      }

        max-width: 1100px;
        margin: 0 auto;
        padding: 32px;
      }

        margin: 0 0 8px;
        font-size: 44px;
      }
      p.lead {
        margin: 0 0 24px;

      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

      }
      .pass-card {
        background: rgba(41, 26, 16, 0.92);
        border: 1px solid rgba(196, 162, 112, 0.28);

      }
      .pass-card h2,

        margin: 0;
      }

        margin-top: 10px;
        color: #eadab7;
        line-height: 1.5;
      }
      .pass-card p.selected {

      }
    </style>
  </head>
  <body>
    <main>
      <h1>Potion Bottle Family Concept Passes</h1>
      <p class="lead">Session <code>2026-03-15-potion-bottle-family</code> · preserved concept history for review and selection.</p>
      <section class="grid">
        
        <article class="pass-card">
          <h2>pass-01</h2>
          <p>Images: concept-01, concept-02, concept-03, concept-04</p>
